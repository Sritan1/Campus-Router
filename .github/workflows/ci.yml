name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the engine
        run: make -C engine
      - name: engine tests
        run: make -C engine test
      - name: route a real pair on the real graph
        run: |
          make -C engine cli
          ./engine/build/route_cli api/data/graph.campus -151960667 -151672202
      - name: it should start and answer
        run: |
          ./engine/build/campus_engine &
          sleep 2
          curl --fail --silent http://127.0.0.1:8081/healthz
          echo

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -r api/requirements-dev.txt
      - name: tests
        run: python -m pytest pipeline api -q

  # the two suites above only ever see their own side. this one runs the
  # real stack and checks what actually comes out of it, which is where
  # the trace sampling bug lived.
  endtoend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the engine
        run: make -C engine
      - name: install
        run: pip install -r api/requirements.txt
      - name: start the gateway
        run: |
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null; then break; fi
            sleep 1
          done
      - name: smoke
        shell: pwsh
        run: ./scripts/smoke.ps1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci
      - name: types
        run: npm run typecheck
      - name: tests
        run: npm test
      - name: build
        run: npm run build
